<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks - Martinez Pro Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#121212;
    --paper:#F8F8F5;
    --gold:#84D122;
    --ink:#121212;
    --line:rgba(34,39,31,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    line-height:1.55;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }
  .card{max-width:480px;text-align:center;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:34px;
    color:var(--pine);
    margin:0 0 16px;
    letter-spacing:-0.01em;
  }
  p{font-size:16px;color:var(--ink);opacity:0.85;margin:0 0 32px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    padding:14px 26px;
    font-size:15px;font-weight:500;
    border-radius:4px;
    border:1px solid var(--pine);
    color:var(--pine);
    text-decoration:none;
  }
  .btn:hover{background:var(--pine);color:var(--paper);}
</style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="Martinez Pro Services logo" style="height:56px;width:56px;border-radius:10px;object-fit:cover;display:block;margin:0 auto 24px;">
    <h1>Thanks - we've got your request.</h1>
    <p>We will follow up within one business day with a rough estimate and schedule a site visit. If it's urgent, call us directly at (720) 987-9855.</p>
    <a href="/" class="btn">Back to the homepage</a>
  </div>
</body>
</html>
